<!doctype html>
<html>
    <head>
        <title>Rustines</title>

        <style>
            body {
                background-color: #d2ffff;
                margin: 0;
                font-family: monospace;
                font-size: 2em;
            }

            #main {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100vh;
                justify-content: center;
            }

            input[type="file"] {
                display: none;
            }

            #label {
                cursor: pointer;
                padding: 0.1em;
                text-align: center;
                display: inline-block;
            }

            #start {
                cursor: pointer;
                text-align: center;
            }

            #status {
                color: green;
            }

            #game_canvas {
                flex: 0 0 auto;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div id="header">
                <label for="rom" id="label">Click here to select ROM</label>
                <input type="file" id="rom" />
            </div>
            <p id="status" role="status"></p>
            <span style="display: none" id="start">Play!</span>
        </div>

        <script type="module">
            import init, { start_wasm } from "./assets/rustines_wasm.js";

            const romInput = document.getElementById("rom");
            const btn = document.getElementById("start");
            const status = document.getElementById("status");
            let romBytes;
            let romName;

            romInput.addEventListener("change", async () => {
                const file = romInput.files[0];
                romBytes = undefined;

                if (!file) {
                    return;
                }

                romName = file.name;

                try {
                    romBytes = new Uint8Array(await file.arrayBuffer());
                    btn.style.display = "unset";
                    status.textContent = `Loaded ${file.name}`;
                } catch (error) {
                    status.textContent = `Could not read file: ${error}`;
                }
            });

            btn.addEventListener("click", async () => {
                try {
                    await init();
                    start_wasm(romBytes, romName);
                    document.getElementById("header").style.display = "none";
                    btn.style.display = "none";
                } catch (error) {
                    status.textContent = `Could not start ROM: ${error}`;
                }

                document.getElementById("game_canvas").focus();
            });
        </script>
    </body>
</html>
