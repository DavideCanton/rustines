[workspace]
members = [
    "crates/rustines",
    "crates/rustines_gui",
    "crates/rustines_wasm",
    "crates/rustines_core",
    "crates/rustines_debug_commands",
    "crates/rustines_gui_utils",
    "crates/rustines_macro",
    "crates/pixels_tries"
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
flexi_logger = { version = "0.31", features = ["async"] }
winit = "0.30"
pixels = "0.17"
winit_input_helper = "0.17"
web-time = "1"
web-sys = { version = "0.3", features = [
    "Document",
    "DomTokenList",
    "Window",
    "HtmlCanvasElement"
] }
