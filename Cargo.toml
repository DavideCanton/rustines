[workspace]
members = [
    "crates/core",
    "crates/gui",
    "crates/macro",
    "crates/rustines",
    "crates/wasm",
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
flexi_logger = { version = "0.31", features = ["async"] }
winit = "0.30"
pixels = "0.17"
winit_input_helper = "0.17"
web-time = "1"
web-sys = { version = "0.3", features = [
    "Document",
    "DomTokenList",
    "EventTarget",
    "Window",
    "HtmlCanvasElement",
    "Storage"
] }
