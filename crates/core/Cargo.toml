[package]
name = "rustines_core"
version = "0.1.0"
authors = ["DavideCanton <davide.canton5@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = { workspace = true }
arrayref = "0.3"
bitfield = "0.20"
bytemuck = { version = "1.25", features = ["derive"] }
log = { workspace = true }
rustines_macro = { path = "../macro" }
thiserror = { workspace = true }
zip = { version = "9.0", features = ["deflate"], default-features = false }

[dev-dependencies]
num-complex = "0.4"
rand = "0.10"
rustfft = "6.1"
test-case = "3.1"
