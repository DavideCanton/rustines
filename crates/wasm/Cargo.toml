[package]
name = "rustines_wasm"
version = "0.1.0"
authors = ["DavideCanton <davide.canton5@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = { version = "0.1" }
console_log = "1.0"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
log = { workspace = true }
pixels = { workspace = true }
rexie = "0.6"
rustines_core = { path = "../core" }
rustines_gui = { path = "../gui" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true }
winit = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--strip-debug"]
